user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /tmp/nginx.pid;
error_log /tmp/error.log;

events { worker_connections 768; }

http {
    log_format  no6 '[$time_local] Jarkom Node Slav Access from $remote_addr using method "$request" returned status $status with $body_bytes_sent bytes sent in $request_time seconds';
    
    server {
        listen 8000;
        listen 8888;
        server_name paskarov.com;

        access_log /tmp/access.log no6;
        root /myscripts/web;
        index slav.html;
        
        location / {
        try_files $uri $uri/ =404;
        }
    }
}