user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /tmp/nginx.pid;
error_log /tmp/error.log;

events { worker_connections 768; }

http {

    upstream roundrobinx {
        server 10.49.41.2;
        server 10.49.40.2:8000;
    }

    log_format  no6 '[$time_local] Jarkom Node Petrov Access from $remote_addr using method "$request" returned status $status with $body_bytes_sent bytes sent in $request_time seconds';
    
    server {
        listen 80;
        server_name openings.com;

        access_log /tmp/access.log no6;
        root /myscripts/web;
        index sicilian.html;

        location = / {
            proxy_pass http://roundrobinx/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /sicilian {
            proxy_pass http://10.49.41.2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /slav {
            proxy_pass http://10.49.40.2:8888/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            rewrite ^ / last;
        }
    }
}